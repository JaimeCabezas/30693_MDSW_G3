<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>United Republic</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 text-white min-h-screen flex items-center justify-center">

  <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-[0_0_40px_rgba(0,0,0,0.5)] w-full max-w-md p-10">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-white tracking-wide">United Republic</h1>
      <p class="text-gray-300 mt-2 text-sm">Inicia sesión para continuar</p>
    </div>

    <form id="form-login" class="space-y-5">
      <div>
        <label for="input-correo" class="block text-sm font-medium text-gray-200 mb-1">Correo electrónico</label>
        <input
          id="input-correo"
          type="email"
          placeholder="correo@ejemplo.com"
          required
          class="bg-slate-800/50 border border-slate-600 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-lg px-4 py-2.5 w-full transition-all"
        />
      </div>

      <div>
        <label for="input-password" class="block text-sm font-medium text-gray-200 mb-1">Contraseña</label>
        <input
          id="input-password"
          type="password"
          placeholder="••••••••"
          required
          class="bg-slate-800/50 border border-slate-600 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-lg px-4 py-2.5 w-full transition-all"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_5px_15px_rgba(0,0,0,0.3)]"
      >
        Ingresar
      </button>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
